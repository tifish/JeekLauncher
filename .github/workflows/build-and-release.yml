name: Build and Release

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    contents: write

env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    RELEASE_TAG: "latest_release"
    PROJECT_NAME: "JeekLauncher"

jobs:
    build_and_release:
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  submodules: recursive

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x

            - name: Compute commit count
              id: ver
              shell: pwsh
              run: |
                  $count = (git rev-list --count HEAD).Trim()
                  "count=$count" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
                  Set-Content -Path version.txt -Value $count -NoNewline -Encoding ascii
                  Write-Host "commit count = $count"

            - name: Publish
              run: dotnet publish JeekLauncher\JeekLauncher.csproj -c Release -r win-x64 --no-self-contained -p:PublishReadyToRun=true -p:PublishTrimmed=false -p:PublishSingleFile=false /p:Version=${{ steps.ver.outputs.count }}

            - name: Zip files
              shell: pwsh
              run: |
                  Get-ChildItem -Path bin -Filter *.pdb -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force
                  Get-ChildItem -Path bin -Filter Logs -Recurse -Directory -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
                  Compress-Archive -Path bin\* -DestinationPath ${{ env.PROJECT_NAME }}.zip -Force

            - name: Publish release
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              shell: pwsh
              run: |
                  git tag -f ${{ env.RELEASE_TAG }}
                  git push -f origin refs/tags/${{ env.RELEASE_TAG }}
                  gh release view ${{ env.RELEASE_TAG }} *> $null
                  if ($LASTEXITCODE -eq 0) {
                      gh release delete ${{ env.RELEASE_TAG }} -y
                  }
                  gh release create ${{ env.RELEASE_TAG }} `
                      ${{ env.PROJECT_NAME }}.zip version.txt `
                      --title ${{ env.RELEASE_TAG }} `
                      --generate-notes `
                      --latest
